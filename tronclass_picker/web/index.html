<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畅课归档</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #161921;
    --panel-2: #1b1f29;
    --border: #232833;
    --text: #e7e9ee;
    --muted: #8a93a6;
    --dim: #5f6878;
    --accent: #4f7cff;
    --accent-soft: #1e2a4a;
    --warn: #e0a33a;
    --ok: #3fbf7f;
    --danger: #e05c5c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }

  .brand {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin-right: 4px;
  }

  .account {
    color: var(--muted);
    font-size: 12px;
  }

  .spacer { flex: 1; }

  .status {
    color: var(--muted);
    font-size: 12px;
    max-width: 46ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 13px;
    cursor: pointer;
    transition: background .12s, border-color .12s, opacity .12s;
  }

  button:hover:not(:disabled) { background: #232936; border-color: #2f3746; }
  button:disabled { opacity: .4; cursor: default; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  button.primary:hover:not(:disabled) { background: #6a90ff; border-color: #6a90ff; }

  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    border-radius: 0;
    background: transparent;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .seg button.active {
    background: var(--accent-soft);
    color: #b9c9ff;
  }

  .bar {
    height: 3px;
    background: #1c212c;
    overflow: hidden;
    flex: none;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .25s ease;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 232px 1fr 340px;
    min-height: 0;
  }

  /* ---- 左侧：课程分类 + 类型筛选 ---- */
  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }

  .side-h {
    padding: 12px 14px 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: .4px;
    flex: none;
  }

  .c-list { flex: none; }

  .c-item {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    text-align: left;
  }
  .c-item:hover { background: #1a1f2b; }
  .c-item.active { background: var(--accent-soft); color: #cdd8ff; }
  .c-item span {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .c-item i {
    font-style: normal;
    font-size: 11px;
    line-height: 1.5;
    color: var(--dim);
    background: #202634;
    border-radius: 9px;
    padding: 0 7px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 14px 16px;
  }
  .chip {
    font-size: 11px;
    padding: 2px 10px;
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--muted);
    background: transparent;
  }
  .chip:hover:not(:disabled) { background: #20263480; }
  .chip.active {
    background: var(--accent-soft);
    color: #b9c9ff;
    border-color: #31437a;
  }
  .chip i { font-style: normal; color: var(--dim); margin-left: 3px; }

  /* ---- 中间：文件表 ---- */
  .left {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }

  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 10px;
  }
  .search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
  }
  .search input::placeholder { color: var(--dim); }

  label.check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .table {
    flex: 1;
    overflow: auto;
    min-height: 0;
  }

  .row, .head {
    display: grid;
    grid-template-columns: 40px 1fr minmax(110px, 190px) 86px;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
  }

  .head {
    position: sticky;
    top: 0;
    z-index: 1;
    height: 34px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    color: var(--dim);
    font-size: 12px;
  }
  .head .sortable { cursor: pointer; user-select: none; }
  .head .sortable:hover { color: var(--text); }

  .row {
    height: 36px;
    border-bottom: 1px solid #1a1e27;
    cursor: pointer;
  }
  .row:hover { background: #141821; }
  .row.on { background: #17203a; }
  .row.off-restrict { opacity: .55; }

  .box {
    width: 15px;
    height: 15px;
    border: 1px solid #38404f;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .row.on .box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .row.on .box::after {
    content: "";
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .cell-course { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-size { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

  .star {
    color: var(--warn);
    margin-left: 6px;
    font-size: 11px;
  }
  .dn {
    color: var(--ok);
    margin-right: 5px;
    font-size: 11px;
  }

  .group {
    padding: 5px 16px 3px;
    font-size: 11px;
    color: var(--dim);
    background: #12151c;
    border-bottom: 1px solid #1a1e27;
    user-select: none;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }

  .count { color: var(--muted); font-size: 12px; }
  .count b { color: var(--text); font-weight: 500; }
  .cur { color: var(--ok); font-size: 12px; }

  /* ---- 右侧：日志 / 通知 ---- */
  .right {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
  }

  .tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
  .tabs button {
    flex: 1;
    border: 0;
    border-radius: 0;
    background: transparent;
    padding: 10px 0 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .tabs button.active {
    color: var(--text);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tabs button .badge {
    font-size: 10px;
    color: #b9c9ff;
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 0 6px;
    margin-left: 4px;
  }

  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.show { display: flex; }

  .log {
    flex: 1;
    overflow: auto;
    padding: 10px 14px;
    font: 11.5px/1.7 Consolas, "Cascadia Mono", monospace;
    color: #9aa4b8;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log .warn { color: var(--warn); }
  .log .err { color: var(--danger); }
  .log .ok { color: var(--ok); }

  .notice-panel { flex: 1; overflow: auto; padding: 10px 12px; }

  .n-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 8px;
    background: var(--panel-2);
  }
  .n-title { font-weight: 500; margin-bottom: 1px; }
  .n-meta { color: var(--dim); font-size: 11px; margin-bottom: 5px; }
  .n-body {
    color: var(--muted);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .hint { padding: 40px 18px; color: var(--dim); text-align: center; font-size: 12px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 76px;
    transform: translateX(-50%) translateY(8px);
    background: #232a38;
    border: 1px solid #313a4c;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 9;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr 300px; }
    .side { display: none; }
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 200px; }
    .left { border-right: 0; border-bottom: 1px solid var(--border); }
    .row, .head { grid-template-columns: 34px 1fr 80px; }
    .cell-course { display: none; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">畅课归档</span>
  <span class="account" id="account">未连接</span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <div class="seg" id="scope">
    <button data-scope="current" class="active">本学期</button>
    <button data-scope="all">全部课程</button>
  </div>
  <button id="reload">重新扫描</button>
  <button id="login">登录</button>
</header>

<div class="bar"><i id="bar"></i></div>

<main>
  <nav class="side">
    <div class="side-h">课程</div>
    <div class="c-list" id="courses"></div>
    <div class="side-h">类型</div>
    <div class="chips" id="types"></div>
  </nav>

  <section class="left">
    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" placeholder="搜索课程或文件名，按 / 聚焦">
      </div>
      <button id="selAll" title="勾选当前显示的全部文件">全选</button>
      <button id="selNone">清空</button>
      <label class="check"><input type="checkbox" id="restricted"> 含受限</label>
    </div>

    <div class="table" id="table">
      <div class="head">
        <div></div>
        <div class="sortable" id="sortName">文件名</div>
        <div>课程</div>
        <div class="sortable" id="sortSize" style="text-align:right">大小</div>
      </div>
      <div id="rows"></div>
    </div>

    <footer>
      <span class="cur" id="cur"></span>
      <span class="count" id="count">未选择</span>
      <span class="spacer"></span>
      <button id="notices">汇总通知</button>
      <button id="download" class="primary">下载选中</button>
    </footer>
  </section>

  <aside class="right">
    <div class="tabs">
      <button id="tabLog" class="active">运行日志</button>
      <button id="tabNotice">通知<span class="badge" id="nBadge" style="display:none">0</span></button>
    </div>
    <div class="panel show" id="panelLog">
      <div class="log" id="log"></div>
    </div>
    <div class="panel" id="panelNotice">
      <div class="notice-panel" id="noticeList">
        <div class="hint">还没有汇总过通知<br>点左下角「汇总通知」开始</div>
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
const els = {
  account: document.getElementById('account'),
  status: document.getElementById('status'),
  rows: document.getElementById('rows'),
  count: document.getElementById('count'),
  cur: document.getElementById('cur'),
  log: document.getElementById('log'),
  bar: document.getElementById('bar'),
  q: document.getElementById('q'),
  restricted: document.getElementById('restricted'),
  selAll: document.getElementById('selAll'),
  selNone: document.getElementById('selNone'),
  courses: document.getElementById('courses'),
  types: document.getElementById('types'),
  sortName: document.getElementById('sortName'),
  sortSize: document.getElementById('sortSize'),
  download: document.getElementById('download'),
  notices: document.getElementById('notices'),
  reload: document.getElementById('reload'),
  login: document.getElementById('login'),
  scope: document.getElementById('scope'),
  tabLog: document.getElementById('tabLog'),
  tabNotice: document.getElementById('tabNotice'),
  panelLog: document.getElementById('panelLog'),
  panelNotice: document.getElementById('panelNotice'),
  noticeList: document.getElementById('noticeList'),
  nBadge: document.getElementById('nBadge'),
  toast: document.getElementById('toast'),
};

const checked = new Set();   // 勾选的任务键
let done = new Set();        // 已在库的任务键（服务端下发）
let files = [];
let signature = '';
let lastLogLen = 0;
let noticeSig = '';
let busy = false;
let courseFilter = '';
let typeFilter = '';
let sortKey = '';
let sortDir = 1;

const TYPE_ORDER = ['PDF', 'PPT', 'Word', 'Excel', '压缩包', '图片', '其他'];
const TYPE_SET = new Set(TYPE_ORDER);

function typeOf(name) {
  const m = String(name).toLowerCase().match(/\.([a-z0-9]+)$/);
  const e = m ? m[1] : '';
  if (e === 'pdf') return 'PDF';
  if (e === 'ppt' || e === 'pptx') return 'PPT';
  if (e === 'doc' || e === 'docx') return 'Word';
  if (e === 'xls' || e === 'xlsx' || e === 'csv') return 'Excel';
  if (['zip', 'rar', '7z', 'tar', 'gz'].includes(e)) return '压缩包';
  if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'].includes(e)) return '图片';
  return '其他';
}

function toast(text) {
  els.toast.textContent = text;
  els.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => els.toast.classList.remove('show'), 1800);
}

function human(n) {
  if (!n) return '';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ---- 侧栏：课程 + 类型 ----
function renderSide() {
  const byCourse = new Map();
  const byType = new Map();
  for (const f of files) {
    byCourse.set(f.course, (byCourse.get(f.course) || 0) + 1);
    const t = typeOf(f.name);
    byType.set(t, (byType.get(t) || 0) + 1);
  }

  const cFrag = document.createDocumentFragment();
  const allBtn = document.createElement('button');
  allBtn.className = 'c-item' + (courseFilter ? '' : ' active');
  allBtn.innerHTML = '<span>全部课程</span><i>' + files.length + '</i>';
  allBtn.addEventListener('click', () => { courseFilter = ''; renderSide(); renderRows(); });
  cFrag.appendChild(allBtn);

  for (const [name, num] of [...byCourse.entries()].sort((a, b) => b[1] - a[1])) {
    const btn = document.createElement('button');
    btn.className = 'c-item' + (courseFilter === name ? ' active' : '');
    btn.title = name;
    btn.innerHTML = '<span>' + esc(name) + '</span><i>' + num + '</i>';
    btn.addEventListener('click', () => {
      courseFilter = courseFilter === name ? '' : name;
      renderSide(); renderRows();
    });
    cFrag.appendChild(btn);
  }
  els.courses.replaceChildren(cFrag);

  const tFrag = document.createDocumentFragment();
  const chipAll = document.createElement('button');
  chipAll.className = 'chip' + (typeFilter ? '' : ' active');
  chipAll.innerHTML = '全部<i>' + files.length + '</i>';
  chipAll.addEventListener('click', () => { typeFilter = ''; renderSide(); renderRows(); });
  tFrag.appendChild(chipAll);
  for (const t of TYPE_ORDER) {
    const num = byType.get(t) || 0;
    if (!num && t !== '其他') continue;
    const chip = document.createElement('button');
    chip.className = 'chip' + (typeFilter === t ? ' active' : '');
    chip.innerHTML = esc(t) + '<i>' + num + '</i>';
    chip.addEventListener('click', () => {
      typeFilter = typeFilter === t ? '' : t;
      renderSide(); renderRows();
    });
    tFrag.appendChild(chip);
  }
  els.types.replaceChildren(tFrag);
}

// ---- 文件表 ----
function sortedFiles() {
  if (!sortKey) return files;
  const arr = [...files];
  arr.sort((a, b) => {
    let d = 0;
    if (sortKey === 'size') d = (a.size || 0) - (b.size || 0);
    else d = String(a.name).localeCompare(String(b.name), 'zh');
    return d * sortDir;
  });
  return arr;
}

function renderRows() {
  const frag = document.createDocumentFragment();
  let lastCourse = null;
  for (const f of sortedFiles()) {
    if (!sortKey && f.course !== lastCourse) {
      lastCourse = f.course;
      const g = document.createElement('div');
      g.className = 'group';
      g.textContent = f.course;
      frag.appendChild(g);
    }
    const row = document.createElement('div');
    row.className = 'row' + (checked.has(f.key) ? ' on' : '');
    row.dataset.key = f.key;
    row.dataset.course = f.course;
    row.dataset.type = typeOf(f.name);
    row.dataset.search = (f.course + ' ' + f.name).toLowerCase();
    row.dataset.restricted = f.restricted ? '1' : '0';
    row.innerHTML =
      '<div><span class="box"></span></div>' +
      '<div class="cell-name">' + (done.has(f.key) ? '<span class="dn" title="已下载过">✓</span>' : '') +
        esc(f.name) +
        (f.restricted ? '<span class="star" title="平台未开放下载">★</span>' : '') + '</div>' +
      '<div class="cell-course">' + esc(f.course) + '</div>' +
      '<div class="cell-size">' + human(f.size) + '</div>';
    row.addEventListener('click', () => toggle(f.key));
    frag.appendChild(row);
  }
  els.rows.replaceChildren(frag);
  applyFilter();
}

function toggle(key) {
  if (checked.has(key)) checked.delete(key);
  else checked.add(key);
  const row = els.rows.querySelector('[data-key="' + CSS.escape(key) + '"]');
  if (row) row.classList.toggle('on', checked.has(key));
  updateCount();
}

function visibleRows() {
  return [...els.rows.querySelectorAll('.row')].filter(r => r.style.display !== 'none');
}

function applyFilter() {
  const q = els.q.value.trim().toLowerCase();
  const withRestricted = els.restricted.checked;
  for (const row of els.rows.querySelectorAll('.row')) {
    const restrictHidden = row.dataset.restricted === '1' && !withRestricted;
    const courseOk = !courseFilter || row.dataset.course === courseFilter;
    const typeOk = !typeFilter || row.dataset.type === typeFilter;
    const match = !q || row.dataset.search.includes(q);
    row.style.display = restrictHidden || !courseOk || !typeOk || !match ? 'none' : '';
    row.classList.toggle('off-restrict', row.dataset.restricted === '1');
  }
  hideEmptyGroups();
  updateCount();
}

function hideEmptyGroups() {
  let group = null;
  let hasVisible = false;
  for (const el of els.rows.children) {
    if (el.classList.contains('group')) {
      if (group && !hasVisible) group.style.display = 'none';
      group = el;
      hasVisible = false;
    } else if (el.classList.contains('row') && el.style.display !== 'none') {
      hasVisible = true;
    }
  }
  if (group && !hasVisible) group.style.display = 'none';
}

function updateCount() {
  const visible = visibleRows().length;
  const restricts = files.filter(f => f.restricted).length;
  const parts = ['已选 <b>' + checked.size + '</b> 个', '显示 ' + visible + ' 个'];
  if (restricts && !els.restricted.checked) parts.push('另有 ' + restricts + ' 个受限未显示');
  els.count.innerHTML = parts.join('　·　');
  els.download.textContent = checked.size ? '下载选中（' + checked.size + '）' : '下载选中';
}

function selectAllVisible() {
  for (const row of visibleRows()) checked.add(row.dataset.key);
  for (const row of els.rows.querySelectorAll('.row')) {
    if (checked.has(row.dataset.key)) row.classList.add('on');
  }
  updateCount();
}

function selectNone() {
  checked.clear();
  for (const row of els.rows.querySelectorAll('.row')) row.classList.remove('on');
  updateCount();
}

function setSort(key) {
  if (sortKey === key) {
    if (sortDir === 1) sortDir = -1;
    else { sortKey = ''; sortDir = 1; }   // 第三次点击取消排序
  } else {
    sortKey = key;
    sortDir = 1;
  }
  els.sortName.textContent = sortKey === 'name' ? ('文件名 ' + (sortDir === 1 ? '▲' : '▼')) : '文件名';
  els.sortSize.textContent = sortKey === 'size' ? ('大小 ' + (sortDir === 1 ? '▲' : '▼')) : '大小';
  renderRows();
}

// ---- 日志 / 通知 ----
function renderLogs(logs) {
  if (logs.length === lastLogLen) return;
  lastLogLen = logs.length;
  els.log.innerHTML = logs.map(item => {
    const cls = item.level >= 40 ? 'err' : item.level >= 30 ? 'warn' : '';
    return cls ? '<span class="' + cls + '">' + esc(item.text) + '</span>' : esc(item.text);
  }).join('\n');
  els.log.scrollTop = els.log.scrollHeight;
}

function renderNotices(items) {
  if (!items.length) return;
  const sig = JSON.stringify(items);
  if (sig === noticeSig) return;
  noticeSig = sig;
  els.noticeList.innerHTML = items.map(n =>
    '<div class="n-item">' +
      '<div class="n-title">' + esc(n.title) + '</div>' +
      '<div class="n-meta">' + esc(n.course || '—') + (n.time ? ' · ' + esc(n.time) : '') + '</div>' +
      (n.body ? '<div class="n-body">' + esc(n.body) + '</div>' : '') +
    '</div>'
  ).join('');
  els.nBadge.textContent = items.length;
  els.nBadge.style.display = '';
}

function switchTab(tab) {
  const logOn = tab === 'log';
  els.tabLog.classList.toggle('active', logOn);
  els.tabNotice.classList.toggle('active', !logOn);
  els.panelLog.classList.toggle('show', logOn);
  els.panelNotice.classList.toggle('show', !logOn);
}

// ---- 轮询 ----
function render(d) {
  busy = d.busy;
  els.account.textContent = d.user ? d.user + ' · ' + d.courseCount + ' 门课程' : '未连接';
  els.status.textContent = d.status || '';

  done = new Set(d.downloaded || []);

  const sig = d.files.map(f => f.key).join('|') + '#' + [...done].length;
  if (sig !== signature) {
    signature = sig;
    files = d.files;
    renderSide();
    renderRows();
  } else {
    files = d.files;
  }

  if (d.scope) {
    for (const b of els.scope.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.scope === d.scope);
    }
  }

  const { done: pDone, total } = d.progress || { done: 0, total: 0 };
  els.bar.style.width = total ? Math.min(100, (pDone / total) * 100) + '%' : '0%';
  els.cur.textContent = busy && d.current && total
    ? '正在下载 ' + pDone + '/' + total + '：' + d.current
    : '';

  renderLogs(d.logs || []);
  renderNotices(d.notices || []);

  for (const b of [els.download, els.notices, els.reload, els.login]) b.disabled = busy;
}

async function post(path, body) {
  await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  tick();
}

async function tick() {
  try {
    const res = await fetch('/api/state');
    render(await res.json());
  } catch (e) {
    els.status.textContent = '与本地服务断开，请确认窗口还在运行';
  }
  setTimeout(tick, 900);
}

// ---- 事件 ----
els.q.addEventListener('input', applyFilter);
els.restricted.addEventListener('change', applyFilter);
els.selAll.addEventListener('click', selectAllVisible);
els.selNone.addEventListener('click', selectNone);
els.sortName.addEventListener('click', () => setSort('name'));
els.sortSize.addEventListener('click', () => setSort('size'));
els.tabLog.addEventListener('click', () => switchTab('log'));
els.tabNotice.addEventListener('click', () => switchTab('notice'));

els.download.addEventListener('click', () => {
  if (!checked.size) return toast('先勾选要下载的文件');
  post('/api/download', { keys: [...checked] });
});

els.notices.addEventListener('click', () => {
  switchTab('notice');
  post('/api/notices');
});
els.reload.addEventListener('click', () => post('/api/reload'));
els.login.addEventListener('click', () => post('/api/login'));

els.scope.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.classList.contains('active')) return;
  post('/api/reload', { scope: btn.dataset.scope });
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== els.q) {
    e.preventDefault();
    els.q.focus();
  }
  if (e.key === 'Escape') els.q.blur();
});

tick();
</script>
</body>
</html>
