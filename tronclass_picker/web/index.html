<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畅课归档</title>
<style>
  :root {
    --canvas: #FBFBF9;
    --surface: #FFFFFF;
    --ink: #17181A;
    --ink-2: #55575C;
    --ink-3: #6E7075;
    --line: #E7E5E1;
    --hover: #F5F4F1;
    --accent: #2E6B5A;
    --accent-soft: #EAF0ED;
    --accent-hover: #275C4D;
    --danger: #A8483F;
    --warn: #8A5F26;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font: 14px/1.65 -apple-system, "PingFang SC", "Hiragino Sans GB",
          "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    position: relative;
    height: 56px; flex: none;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .account { font-size: 12px; color: var(--ink-3); }
  .status { font-size: 12px; color: var(--ink-3); margin-right: auto; }
  .status.danger { color: var(--danger); }
  .status .retry {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 12px; padding: 0 0 0 8px;
  }
  .seg {
    display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .seg button {
    border: none; background: transparent; padding: 5px 14px;
    font-size: 12px; color: var(--ink-2); cursor: pointer;
  }
  .seg button.active { background: var(--accent-soft); color: var(--ink); }
  .ghost {
    background: transparent; border: none; cursor: pointer;
    height: 32px; padding: 0 12px; border-radius: 6px;
    font-size: 13px; color: var(--ink-2);
  }
  .ghost:hover { background: var(--hover); }
  .ghost:disabled { color: var(--ink-3); cursor: not-allowed; }
  .ghost.outline-accent {
    border: 1px solid var(--accent); color: var(--accent); background: transparent;
  }
  .progress { position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; opacity: 0; background: transparent; transition: opacity .2s; }
  .progress.on { opacity: 1; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease-out; }

  /* ---------- 三栏 ---------- */
  .main {
    flex: 1; display: grid;
    grid-template-columns: 240px minmax(0, 1fr) 336px;
    min-height: 0;
  }

  /* 左栏 */
  aside.side {
    border-right: 1px solid var(--line);
    padding: 20px 16px;
    display: flex; flex-direction: column; min-height: 0;
    background: var(--canvas);
  }
  .side-h {
    font-size: 12px; font-weight: 500; color: var(--ink-3);
    letter-spacing: .04em; margin-bottom: 8px;
  }
  .side-courses { flex: 1; min-height: 0; overflow-y: auto; margin-bottom: 20px; }
  .c-item {
    position: relative; display: flex; justify-content: space-between; align-items: center;
    width: 100%; height: 32px; padding: 0 8px; border: none; background: transparent;
    border-radius: 4px; font-size: 13px; color: var(--ink-2); cursor: pointer;
    font-family: inherit; text-align: left;
  }
  .c-item:hover { background: var(--hover); }
  .c-item.active { background: var(--accent-soft); color: var(--ink); }
  .c-item.active::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--accent);
  }
  .c-item i { font-style: normal; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .type-row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .type-row button {
    border: none; background: transparent; cursor: pointer;
    font-size: 12px; color: var(--ink-2); padding: 2px 0;
    border-bottom: 1px solid transparent; font-family: inherit;
  }
  .type-row button i { font-style: normal; color: var(--ink-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .type-row button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* 中栏 */
  .middle { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .toolbar {
    flex: none; height: 48px; padding: 0 20px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--line);
  }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; max-width: 560px; }
  .search svg { flex: none; }
  .search input {
    flex: 1; border: none; border-bottom: 1px solid var(--line); background: transparent;
    height: 32px; font-size: 14px; color: var(--ink); outline: none; font-family: inherit;
    padding: 0;
  }
  .search input:focus { border-bottom-color: var(--accent); }
  .search input::placeholder { color: var(--ink-3); }
  .tbtn {
    border: none; background: transparent; cursor: pointer;
    font-size: 12px; color: var(--ink-2); padding: 4px 8px; font-family: inherit;
  }
  .tbtn:hover { color: var(--ink); }
  .restricted { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .restricted input { margin: 0; }

  .listwrap { flex: 1; overflow-y: auto; position: relative; min-height: 0; }
  .list-head, .row, .group { display: grid; grid-template-columns: 40px minmax(0,1fr) 180px 88px; align-items: center; }
  .list-head {
    position: sticky; top: 0; z-index: 2;
    height: 36px; padding: 0 20px; background: var(--surface);
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--ink-3);
  }
  .list-head .c-size, .row .c-size { text-align: right; }
  .sortable { cursor: pointer; user-select: none; }
  .sortable .arrow { color: var(--accent); margin-left: 4px; font-size: 10px; }
  .group {
    position: sticky; top: 36px; z-index: 1;
    height: 28px; padding: 0 20px;
    background: var(--canvas);
    font-size: 12px; color: var(--ink-3); letter-spacing: .04em;
  }
  .row {
    height: 44px; padding: 0 20px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .c-check { display: flex; align-items: center; }
  .box {
    width: 16px; height: 16px; border: 1px solid var(--line); border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); transition: background-color .15s;
  }
  .row.on .box { background: var(--accent); border-color: var(--accent); }
  .row.on .box svg { display: block; }
  .box svg { display: none; }
  .c-name {
    font-size: 14.5px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 16px;
  }
  .row.restricted-row .c-name { color: var(--ink-3); font-weight: 400; }
  .c-course { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
  .c-size { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tag-done { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-right: 8px; }
  .tag-restricted { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 8px; }

  .bottombar {
    flex: none; height: 52px; padding: 0 20px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
  }
  .cur { font-size: 12px; color: var(--ink-2); max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottombar .right { display: flex; align-items: center; gap: 16px; }
  .count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .count b { font-weight: 500; color: var(--ink); font-size: 13px; }
  .primary {
    background: var(--accent); color: #fff; border: none;
    height: 32px; padding: 0 16px; border-radius: 6px; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  .primary:hover { background: var(--accent-hover); }
  .primary:disabled { background: var(--hover); color: var(--ink-3); cursor: not-allowed; }

  /* 右栏 */
  aside.right {
    border-left: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; min-height: 0;
  }
  .tabs { flex: none; height: 44px; display: flex; gap: 24px; padding: 0 20px; align-items: stretch; }
  .tabs button {
    border: none; background: transparent; cursor: pointer;
    font-size: 12px; color: var(--ink-3); padding: 0;
    border-bottom: 1px solid transparent; font-family: inherit;
  }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs button .badge { color: var(--accent); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .panel { display: none; flex: 1; overflow-y: auto; padding: 16px 20px; min-height: 0; }
  .panel.show { display: block; }
  .log {
    font: 12px/1.7 ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
    color: var(--ink-2); white-space: pre-wrap; word-break: break-all;
  }
  .log .warn { color: var(--warn); }
  .log .err { color: var(--danger); }
  .n-item { margin-bottom: 20px; }
  .n-title { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .n-meta { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .n-body { font-size: 12px; color: var(--ink-2); margin-top: 6px; line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .empty-note { text-align: center; padding: 60px 20px; }
  .empty-note .big { font-size: 14px; color: var(--ink-3); }
  .empty-note .small { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
  .empty-note .tbtn { color: var(--accent); margin-top: 12px; }
  .skel { height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 16px; }
  .skel i { display: block; height: 12px; border-radius: 3px; background: var(--hover); animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 4px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 0 16px; height: 36px; display: flex; align-items: center;
    font-size: 12px; color: var(--ink-2);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 1279px) { .main { grid-template-columns: 200px minmax(0,1fr) 280px; } .list-head, .row, .group { grid-template-columns: 40px minmax(0,1fr) 160px 88px; } }
  @media (max-width: 1023px) { .main { grid-template-columns: minmax(0,1fr); } aside.side, aside.right { display: none; } }
</style>
</head>
<body>

<header>
  <span class="brand">畅课归档</span>
  <span class="account" id="account">未连接</span>
  <span class="status" id="status"><span id="statusText"></span><button id="retryBtn" class="retry" hidden>重试</button></span>
  <div class="seg" id="scope">
    <button data-scope="current" class="active">本学期</button>
    <button data-scope="all">全部课程</button>
  </div>
  <button id="reload" class="ghost">重新扫描</button>
  <button id="login" class="ghost">登录</button>
  <div class="progress" id="progress"><i></i></div>
</header>

<div class="main">
  <aside class="side">
    <div class="side-courses">
      <div class="side-h">课程</div>
      <div id="courses"></div>
    </div>
    <div>
      <div class="side-h">类型</div>
      <div class="type-row" id="types"></div>
    </div>
  </aside>

  <main class="middle">
    <div class="toolbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="q" type="search" placeholder="搜索课程或文件名，按 / 聚焦" autocomplete="off">
      </div>
      <button id="selAll" class="tbtn">全选</button>
      <button id="selNone" class="tbtn">清空</button>
      <label class="restricted"><input type="checkbox" id="restricted"> 含受限</label>
    </div>

    <div class="listwrap" id="listwrap">
      <div class="list-head">
        <div></div>
        <div class="sortable" id="sortName">文件名<span class="arrow"></span></div>
        <div class="c-course" style="padding-left:0">课程</div>
        <div class="sortable c-size" id="sortSize">大小<span class="arrow"></span></div>
      </div>
      <div id="rows"></div>
      <div id="empty" class="empty-note" hidden>
        <div class="big">这个范围里还没有可下载的文件</div>
        <div class="small">换个课程，或清空搜索试试</div>
        <button id="emptyReload" class="tbtn">重新扫描</button>
      </div>
      <div id="skeleton" hidden>
        <div class="skel"><i style="width:16px;height:16px"></i><i style="width:280px"></i><i style="width:140px;margin-left:auto"></i></div>
        <div class="skel"><i style="width:16px;height:16px"></i><i style="width:220px"></i><i style="width:120px;margin-left:auto"></i></div>
        <div class="skel"><i style="width:16px;height:16px"></i><i style="width:320px"></i><i style="width:100px;margin-left:auto"></i></div>
      </div>
    </div>

    <div class="bottombar">
      <span class="cur" id="cur"></span>
      <div class="right">
        <span class="count" id="count"></span>
        <button id="notices" class="ghost">汇总通知</button>
        <button id="download" class="primary">下载选中</button>
      </div>
    </div>
  </main>

  <aside class="right">
    <div class="tabs">
      <button id="tabLog" class="active">运行日志</button>
      <button id="tabNotice">通知 <span class="badge" id="nBadge" hidden>0</span></button>
    </div>
    <div class="panel show" id="panelLog">
      <div class="log" id="log"></div>
    </div>
    <div class="panel" id="panelNotice">
      <div id="noticeList"></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const els = {
  account: document.getElementById('account'),
  status: document.getElementById('status'),
  statusText: document.getElementById('statusText'),
  retry: document.getElementById('retryBtn'),
  scope: document.getElementById('scope'),
  reload: document.getElementById('reload'),
  login: document.getElementById('login'),
  progress: document.getElementById('progress'),
  bar: document.querySelector('#progress i'),
  courses: document.getElementById('courses'),
  types: document.getElementById('types'),
  q: document.getElementById('q'),
  restricted: document.getElementById('restricted'),
  selAll: document.getElementById('selAll'),
  selNone: document.getElementById('selNone'),
  rows: document.getElementById('rows'),
  listwrap: document.getElementById('listwrap'),
  empty: document.getElementById('empty'),
  skeleton: document.getElementById('skeleton'),
  emptyReload: document.getElementById('emptyReload'),
  sortName: document.getElementById('sortName'),
  sortSize: document.getElementById('sortSize'),
  cur: document.getElementById('cur'),
  count: document.getElementById('count'),
  notices: document.getElementById('notices'),
  download: document.getElementById('download'),
  tabLog: document.getElementById('tabLog'),
  tabNotice: document.getElementById('tabNotice'),
  panelLog: document.getElementById('panelLog'),
  panelNotice: document.getElementById('panelNotice'),
  log: document.getElementById('log'),
  noticeList: document.getElementById('noticeList'),
  nBadge: document.getElementById('nBadge'),
  toast: document.getElementById('toast'),
};

const CHECK_SVG = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5.5 4 8 8.5 2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let files = [];
let signature = '';
let lastLogLen = 0;
let noticeSig = '';
let busy = false;
let courseFilter = '';
let typeFilter = '';
let sortKey = '';
let sortDir = 1;
const checked = new Set();

const TYPE_ORDER = ['PDF', 'PPT', 'Word', 'Excel', '压缩包', '图片', '其他'];

function typeOf(name) {
  const m = String(name).toLowerCase().match(/\.([a-z0-9]+)$/);
  const e = m ? m[1] : '';
  if (e === 'pdf') return 'PDF';
  if (e === 'ppt' || e === 'pptx') return 'PPT';
  if (e === 'doc' || e === 'docx') return 'Word';
  if (e === 'xls' || e === 'xlsx' || e === 'csv') return 'Excel';
  if (['zip', 'rar', '7z', 'tar', 'gz'].includes(e)) return '压缩包';
  if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'].includes(e)) return '图片';
  return '其他';
}

function human(n) {
  if (!n) return '';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function toast(text) {
  els.toast.textContent = text;
  els.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => els.toast.classList.remove('show'), 1800);
}

// ---------- 派生视图 ----------
function view() {
  const q = els.q.value.trim().toLowerCase();
  const showRestricted = els.restricted.checked;
  let list = files.filter(f => {
    if (f.restricted && !showRestricted) return false;
    if (courseFilter && f.course !== courseFilter) return false;
    if (typeFilter && typeOf(f.name) !== typeFilter) return false;
    if (q && !((f.course + ' ' + f.name).toLowerCase().includes(q))) return false;
    return true;
  });
  if (sortKey) {
    list = [...list].sort((a, b) => {
      let d = 0;
      if (sortKey === 'size') d = (a.size || 0) - (b.size || 0);
      else d = String(a.name).localeCompare(String(b.name), 'zh');
      return d * sortDir;
    });
  }
  return list;
}

// ---------- 侧栏 ----------
function renderSide() {
  const byCourse = new Map();
  const byType = new Map();
  for (const f of files) {
    byCourse.set(f.course, (byCourse.get(f.course) || 0) + 1);
    const t = typeOf(f.name);
    byType.set(t, (byType.get(t) || 0) + 1);
  }
  const cFrag = document.createDocumentFragment();
  const allBtn = document.createElement('button');
  allBtn.className = 'c-item' + (courseFilter ? '' : ' active');
  allBtn.innerHTML = '<span>全部课程</span><i>' + files.length + '</i>';
  allBtn.addEventListener('click', () => { courseFilter = ''; renderSide(); renderRows(); });
  cFrag.appendChild(allBtn);
  for (const [name, num] of [...byCourse.entries()].sort((a, b) => b[1] - a[1])) {
    const btn = document.createElement('button');
    btn.className = 'c-item' + (courseFilter === name ? ' active' : '');
    btn.title = name;
    btn.innerHTML = '<span>' + esc(name) + '</span><i>' + num + '</i>';
    btn.addEventListener('click', () => {
      courseFilter = courseFilter === name ? '' : name;
      renderSide(); renderRows();
    });
    cFrag.appendChild(btn);
  }
  els.courses.replaceChildren(cFrag);

  const tFrag = document.createDocumentFragment();
  const chipAll = document.createElement('button');
  chipAll.className = typeFilter ? '' : 'active';
  chipAll.innerHTML = '全部<i>' + files.length + '</i>';
  chipAll.addEventListener('click', () => { typeFilter = ''; renderSide(); renderRows(); });
  tFrag.appendChild(chipAll);
  for (const t of TYPE_ORDER) {
    const num = byType.get(t) || 0;
    if (!num && t !== '其他') continue;
    const chip = document.createElement('button');
    chip.className = typeFilter === t ? 'active' : '';
    chip.innerHTML = esc(t) + '<i>' + num + '</i>';
    chip.addEventListener('click', () => {
      typeFilter = typeFilter === t ? '' : t;
      renderSide(); renderRows();
    });
    tFrag.appendChild(chip);
  }
  els.types.replaceChildren(tFrag);
}

// ---------- 文件表 ----------
function renderRows() {
  const list = view();
  const frag = document.createDocumentFragment();
  let lastCourse = null;
  for (const f of list) {
    if (!sortKey && f.course !== lastCourse) {
      lastCourse = f.course;
      const g = document.createElement('div');
      g.className = 'group';
      g.textContent = f.course;
      frag.appendChild(g);
    }
    const row = document.createElement('div');
    row.className = 'row' + (checked.has(f.key) ? ' on' : '') + (f.restricted ? ' restricted-row' : '');
    row.dataset.key = f.key;
    row.innerHTML =
      '<div class="c-check"><span class="box">' + CHECK_SVG + '</span></div>' +
      '<div class="c-name">' +
        (f.done ? '<span class="tag-done">已存</span>' : '') +
        esc(f.name) +
        (f.restricted ? '<span class="tag-restricted">受限</span>' : '') +
      '</div>' +
      '<div class="c-course">' + esc(f.course) + '</div>' +
      '<div class="c-size">' + human(f.size) + '</div>';
    row.title = f.name;
    row.addEventListener('click', () => {
      if (checked.has(f.key)) checked.delete(f.key); else checked.add(f.key);
      row.classList.toggle('on', checked.has(f.key));
      updateCount();
    });
    frag.appendChild(row);
  }
  els.rows.replaceChildren(frag);

  els.empty.hidden = !(!busy && files.length === 0 && !sortKey);
  els.skeleton.hidden = !(busy && files.length === 0);
  updateCount();
}

function updateCount() {
  const visible = view().length;
  const restricts = files.filter(f => f.restricted).length;
  const parts = ['已选 <b>' + checked.size + '</b> 个', '显示 ' + visible + ' 个'];
  if (restricts && !els.restricted.checked) parts.push('另有 ' + restricts + ' 个受限未显示');
  els.count.innerHTML = parts.join('　·　');
  els.download.textContent = checked.size ? '下载选中（' + checked.size + '）' : '下载选中';
}

function setSort(key) {
  if (sortKey === key) {
    if (sortDir === 1) sortDir = -1;
    else { sortKey = ''; sortDir = 1; }
  } else {
    sortKey = key; sortDir = 1;
  }
  els.sortName.querySelector('.arrow').textContent = sortKey === 'name' ? (sortDir === 1 ? '↑' : '↓') : '';
  els.sortSize.querySelector('.arrow').textContent = sortKey === 'size' ? (sortDir === 1 ? '↑' : '↓') : '';
  renderRows();
}

// ---------- 日志 / 通知 ----------
function renderLogs(logs) {
  if (logs.length === lastLogLen) return;
  const atBottom = els.log.parentElement.scrollHeight - els.log.parentElement.scrollTop - els.log.parentElement.clientHeight < 40;
  lastLogLen = logs.length;
  els.log.innerHTML = logs.map(item => {
    const lv = String(item.level || '').toUpperCase();
    const cls = lv === 'ERROR' || lv === '40' || lv === '50' ? 'err' : lv === 'WARN' || lv === '30' ? 'warn' : '';
    return cls ? '<span class="' + cls + '">' + esc(item.text) + '</span>' : esc(item.text);
  }).join('\n');
  if (atBottom) els.log.parentElement.scrollTop = els.log.parentElement.scrollHeight;
}

function renderNotices(items) {
  const sig = JSON.stringify(items);
  if (sig === noticeSig) return;
  noticeSig = sig;
  if (!items.length) { els.noticeList.innerHTML = '<div class="empty-note"><div class="big">还没有汇总过通知</div><div class="small">点左下角「汇总通知」开始</div></div>'; els.nBadge.hidden = true; return; }
  els.nBadge.textContent = items.length;
  els.nBadge.hidden = false;
  els.noticeList.innerHTML = items.map(n =>
    '<div class="n-item">' +
      '<div class="n-title">' + esc(n.title) + '</div>' +
      '<div class="n-meta">' + esc(n.course || (n.scope === 'platform' ? '平台公告' : '—')) + (n.time ? ' · ' + esc(n.time) : '') + '</div>' +
      (n.body ? '<div class="n-body">' + esc(n.body) + '</div>' : '') +
    '</div>'
  ).join('');
}

function switchTab(tab) {
  const logOn = tab === 'log';
  els.tabLog.classList.toggle('active', logOn);
  els.tabNotice.classList.toggle('active', !logOn);
  els.panelLog.classList.toggle('show', logOn);
  els.panelNotice.classList.toggle('show', !logOn);
}

// ---------- 渲染 ----------
function render(d) {
  busy = d.busy;
  els.account.textContent = d.user ? d.user + ' · ' + d.courses + ' 门课程' : '未连接';

  const statusText = d.status || '';
  const isBad = /登录已失效|与本地服务断开/.test(statusText);
  els.status.classList.toggle('danger', isBad);
  els.statusText.textContent = statusText;
  els.retry.hidden = !/与本地服务断开/.test(statusText);

  els.login.classList.toggle('outline-accent', /登录已失效/.test(statusText));

  const sig = (d.files || []).map(f => f.key).join('|');
  if (sig !== signature) {
    signature = sig;
    files = d.files || [];
    renderSide();
    renderRows();
  }

  if (d.scope) {
    for (const b of els.scope.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.scope === d.scope);
    }
  }

  const p = d.progress || { done: 0, total: 0 };
  const showBar = busy && p.total > 0;
  els.progress.classList.toggle('on', !!showBar);
  if (showBar) els.bar.style.width = Math.min(100, (p.done / p.total) * 100) + '%';
  els.cur.textContent = (busy && d.current && p.total) ? '正在下载 ' + p.done + '/' + p.total + '：' + d.current : '';

  renderLogs(d.logs || []);
  renderNotices(d.notices || []);

  for (const b of [els.download, els.notices, els.reload, els.login]) b.disabled = busy;
  updateCount();
}

async function post(path, body) {
  await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  }).catch(() => {});
  tick();
}

async function tick() {
  try {
    const res = await fetch('/api/state');
    if (!res.ok) throw new Error('http');
    render(await res.json());
  } catch (e) {
    els.status.classList.add('danger');
    els.statusText.textContent = '与本地服务断开，请确认窗口还在运行';
    els.retry.hidden = false;
    for (const b of [els.download, els.notices, els.reload, els.login]) b.disabled = false;
  }
  setTimeout(tick, 900);
}

// ---------- 事件 ----------
els.q.addEventListener('input', renderRows);
els.restricted.addEventListener('change', renderRows);
els.selAll.addEventListener('click', () => { for (const f of view()) checked.add(f.key); renderRows(); });
els.selNone.addEventListener('click', () => { checked.clear(); renderRows(); });
els.sortName.addEventListener('click', () => setSort('name'));
els.sortSize.addEventListener('click', () => setSort('size'));
els.tabLog.addEventListener('click', () => switchTab('log'));
els.tabNotice.addEventListener('click', () => switchTab('notice'));
els.emptyReload.addEventListener('click', () => post('/api/reload'));
els.retry.addEventListener('click', tick);

els.download.addEventListener('click', () => {
  if (!checked.size) return toast('先勾选要下载的文件');
  post('/api/download', { keys: [...checked] });
});
els.notices.addEventListener('click', () => { switchTab('notice'); post('/api/notices'); });
els.reload.addEventListener('click', () => post('/api/reload'));
els.login.addEventListener('click', () => post('/api/login'));

els.scope.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.classList.contains('active')) return;
  post('/api/reload', { scope: btn.dataset.scope });
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== els.q) {
    e.preventDefault(); els.q.focus();
  }
  if (e.key === 'Escape') els.q.blur();
});

tick();
</script>
</body>
</html>
