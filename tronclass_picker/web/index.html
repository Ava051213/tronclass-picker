<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畅课归档</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <span class="brand">畅课归档</span>
  <span class="account" id="account">未连接</span>
  <span class="status" id="status"><span id="statusText"></span><button id="retryBtn" class="retry" hidden>重试</button></span>
  <div class="seg" id="scope">
    <button data-scope="current" class="active">本学期</button>
    <button data-scope="all">全部课程</button>
  </div>
  <button id="reload" class="ghost">重新扫描</button>
  <button id="login" class="ghost">登录</button>
  <div class="progress" id="progress"><i></i></div>
</header>

<div class="main">
  <aside class="side">
    <div class="side-courses">
      <div class="side-h">课程</div>
      <div id="courses"></div>
    </div>
    <div>
      <div class="side-h">类型</div>
      <div class="type-row" id="types"></div>
    </div>
  </aside>

  <main class="middle">
    <div class="toolbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="q" type="search" placeholder="搜索课程或文件名，按 / 聚焦" autocomplete="off">
      </div>
      <button id="selAll" class="tbtn">全选</button>
      <button id="selNone" class="tbtn">清空</button>
      <label class="restricted"><input type="checkbox" id="restricted"> 含受限</label>
    </div>

    <div class="listwrap" id="listwrap">
      <div class="list-head">
        <div></div>
        <div class="sortable" id="sortName">文件名<span class="arrow"></span></div>
        <div class="c-course" style="padding-left:0">课程</div>
        <div class="sortable c-size" id="sortSize">大小<span class="arrow"></span></div>
      </div>
      <div id="rows"></div>
      <div id="empty" class="empty-note" hidden>
        <div class="big">这个范围里还没有可下载的文件</div>
        <div class="small">换个课程，或清空搜索试试</div>
        <button id="emptyReload" class="tbtn">重新扫描</button>
      </div>
      <div id="skeleton" hidden>
        <div class="skel"><i style="width:16px;height:16px"></i><i style="width:280px"></i><i style="width:140px;margin-left:auto"></i></div>
        <div class="skel"><i style="width:16px;height:16px"></i><i style="width:220px"></i><i style="width:120px;margin-left:auto"></i></div>
        <div class="skel"><i style="width:16px;height:16px"></i><i style="width:320px"></i><i style="width:100px;margin-left:auto"></i></div>
      </div>
    </div>

    <div class="bottombar">
      <span class="cur" id="cur"></span>
      <div class="right">
        <span class="count" id="count"></span>
        <button id="notices" class="ghost">汇总通知</button>
        <button id="download" class="primary">下载选中</button>
      </div>
    </div>
  </main>

  <aside class="right">
    <div class="tabs">
      <button id="tabLog" class="active">运行日志</button>
      <button id="tabNotice">通知 <span class="badge" id="nBadge" hidden>0</span></button>
    </div>
    <div class="panel show" id="panelLog">
      <div class="log" id="log"></div>
    </div>
    <div class="panel" id="panelNotice">
      <div id="noticeList"></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
